<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Liste des pays</title>
</head>
<body>
    <h1>Liste des pays</h1>
    <table>
        <thead>
            <tr>
                <th>Pays</th>
                <th>Population (M)</th>
                <th>Superficie (km2)</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>France</td>
                <td class="col">65.2</td>
                <td class="col">551 000</td>
            </tr>
            <tr>
                <td>Espagne</td>
                <td class="col">46.7</td>
                <td class="col">510 000</td>
            </tr>
            <tr>
                <td>Suède</td>
                <td class="col">10.1</td>
                <td class="col">450 000</td>
            </tr>
            <tr>
                <td>Allemagne</td>
                <td class="col">83.8</td>
                <td class="col">357 000</td>
            </tr>
            <tr>
                <td>Finlande</td>
                <td class="col">5.5</td>
                <td class="col">338 000</td>
            </tr>
            <tr>
                <td>Norvège</td>
                <td class="col">5.4</td>
                <td class="col">323 000</td>
            </tr>
            <tr>
                <td>Italie</td>
                <td class="col">60.4</td>
                <td class="col">301 000</td>
            </tr>
            <tr>
                <td>Royaume-Uni</td>
                <td class="col">67.9</td>
                <td class="col">243 000</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
