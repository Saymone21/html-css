<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nous contacter</title>
    <meta name="description" content="Des questions ? Contactez nos équipes ici.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="logo">
        <img  src="MotoGparts-logo2.png" alt="logo de MotoGParts">
        <nav>
            <ul>
                <li><a href="index.html">Accueil</a></li>
                <li><a href="catalogue.html">Nos produits</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1>Nous contacter</h1>
        <section>
            <p>Un problème ? Une question ? Remplissez le formulaire ci-dessous et notre équipe vous recontactera sous 48h amximum.</p>
        </section>
        <section>
            <h2>Formulaire de contact</h2>
            <form action="" method="post">
                <fieldset>
                <label for="nom">Nom :</label>
                <input type="text" name="nom" placeholder="Pernaut"> <br>

                <label for="prenom">Prénom :</label>
                <input type="text" name="prenom" placeholder="Jean-Pierre"> <br>
                
                <label for="email">Email : </label>
                <input type="email" name="email" placeholder="@mail.com"> <br>
                
                <label for="">Décrivez-nous votre problème :</label> <br>
                <textarea name="" id=""></textarea> <br>
                </fieldset>

                <button type="submit">Envoyer</button>
            </form>
        </section>
    </main>

    <footer>
        <p>(c) 2026 MotoGParts - Tous droits réservés</p>
    </footer>
</body>
</html>
