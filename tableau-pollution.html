<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="tableau-pollution.css">
    <title>Pays les plus polluants de la planète</title>
</head>
<body>
    <h1>Pays les plus polluants de la planète (CO<sub>2</sub>)</h1>
    <table>
        <thead>
            <tr>
                <th class="pays">Pays</th>
                <th class="data">CO<sub>2</sub> <br> (en milliards de tonnes)</th>
                <th class="data">CO<sub>2</sub> <br>(en %)</th>
                <th class="data">en tonnes par hab.</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td class="pays"><img src="https://flagsapi.com/CN/flat/16.png">Chine</td>
                <td class="data">9.26</td>
                <td class="data">28.2</td>
                <td class="data">6.68</td>
            </tr>
            <tr>
                <td class="pays"><img src="https://flagsapi.com/US/flat/16.png">Etats-Unis</td>
                <td class="data">4.76</td>
                <td class="data">14.5</td>
                <td class="data">14.61</td>
            </tr>
            <tr>
                <td class="pays"><img src="https://flagsapi.com/IN/flat/16.png">Inde</td>
                <td class="data">2.16</td>
                <td class="data">6.6</td>
                <td class="data">1.61</td>
            </tr>
            <tr>
                <td class="pays"><img src="https://flagsapi.com/RU/flat/16.png">Russie</td>
                <td class="data">1.54</td>
                <td class="data">4.7</td>
                <td class="data">10.64</td>
            </tr>
        </tbody>
    </table>
    
</body>
</html>
